<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiNova - بوابة التجارة الإلكترونية</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 50px;
            color: white;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-right: 4px solid #667eea;
        }

        .feature-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .feature h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .feature p {
            color: #666;
            font-size: 14px;
        }

        .pi-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        .pi-button:hover {
            transform: translateY(-2px);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
        }

        .testnet-badge {
            display: inline-block;
            background: #ff9800;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛒</div>
        
        <span class="testnet-badge">🧪 Testnet</span>
        
        <h1>PiNova</h1>
        <p class="subtitle">بوابة التجارة الإلكترونية على Pi Network</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <h3>آمن وموثوق</h3>
                <p>معاملات آمنة 100% على شبكة Pi</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <h3>سريع وسهل</h3>
                <p>تسوق ودفع في ثوانٍ معدودة</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🌍</div>
                <h3>عالمي</h3>
                <p>متاح للجميع في جميع أنحاء العالم</p>
            </div>
        </div>

        <button class="pi-button" onclick="connectWallet()">
            🔗 ربط محفظة Pi
        </button>

        <div id="status" class="status"></div>

        <div class="footer">
            <p>© 2024 PiNova - جميع الحقوق محفوظة</p>
            <p>مدعوم بواسطة Pi Network</p>
        </div>
    </div>

    <script>
        // Initialize Pi SDK
        const Pi = window.Pi;
        
        function connectWallet() {
            const statusDiv = document.getElementById('status');
            
            try {
                Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
                    .then(function(auth) {
                        console.log(auth);
                        statusDiv.className = 'status success';
                        statusDiv.innerHTML = `
                            ✅ تم الاتصال بنجاح!<br>
                            اسم المستخدم: ${auth.user.username}<br>
                            المعرف: ${auth.user.id}
                        `;
                    })
                    .catch(function(error) {
                        console.error(error);
                        statusDiv.className = 'status error';
                        statusDiv.innerHTML = '❌ حدث خطأ في الاتصال';
                    });
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = '❌ تأكد من أنك تستخدم Pi Browser';
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment found", payment);
        }

        // Check if running in Pi Browser
        window.onload = function() {
            if (!navigator.userAgent.includes('PiBrowser')) {
                console.log('Not running in Pi Browser');
            }
        };
    </script>
</body>
</html>
