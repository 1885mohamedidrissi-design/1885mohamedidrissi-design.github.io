<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiNova - بوابة التجارة الإلكترونية</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto;
        }

        .testnet-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff9800;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            border-right: 4px solid #667eea;
            transition: transform 0.3s;
        }

        .feature-card:hover {
            transform: translateX(-5px);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .feature-title {
            color: #333;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feature-desc {
            color: #666;
            font-size: 14px;
        }

        .pi-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .pi-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">🛒</div>
            <span class="testnet-badge">Testnet</span>
        </div>

        <h1>PiNova</h1>
        <p class="subtitle">بوابة التجارة الإلكترونية على Pi Network</p>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <div class="feature-title">آمن وموثوق</div>
                <div class="feature-desc">معاملات آمنة 100% على شبكة Pi</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">سريع وسهل</div>
                <div class="feature-desc">تسوق ودفع في ثوانٍ معدودة</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon">🌍</div>
                <div class="feature-title">عالمي</div>
                <div class="feature-desc">متاح للجميع في جميع أنحاء العالم</div>
            </div>
        </div>

        <button class="pi-button" id="connectBtn">
            🔗 الاتصال بـ Pi Wallet
        </button>

        <div id="status" class="status" style="display: none;"></div>

        <footer>
            <p>© 2026 PiNova - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        // تهيئة Pi SDK
        const Pi = window.Pi;
        
        if (Pi) {
            Pi.init({ version: "2.0", sandbox: true });
        }

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        function showStatus(message, isSuccess) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + (isSuccess ? 'success' : 'error');
            statusDiv.style.display = 'block';
        }

        connectBtn.addEventListener('click', async () => {
            try {
                if (!Pi) {
                    showStatus('️ Pi SDK غير متوفر. افتح التطبيق في Pi Browser', false);
                    return;
                }

                showStatus(' جاري الاتصال...', true);

                const scopes = ['username', 'payments'];
                
                const onIncompletePaymentFound = (payment) => {
                    console.log('دفع غير مكتمل:', payment);
                };

                await Pi.authenticate(scopes, onIncompletePaymentFound);
                
                showStatus('✅ تم الاتصال بنجاح! مرحباً بك في PiNova', true);
                connectBtn.textContent = '✅ متصل';
                
            } catch (error) {
                console.error('خطأ في الاتصال:', error);
                showStatus('❌ فشل الاتصال: ' + error.message, false);
            }
        });

        // التحقق من حالة SDK عند التحميل
        window.addEventListener('load', () => {
            if (Pi) {
                console.log('✅ Pi SDK تم تحميله بنجاح');
            } else {
                console.log('⚠️ Pi SDK غير متوفر');
            }
        });
    </script>
</body>
</html>
